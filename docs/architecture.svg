<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="description">The browser connects to Express, which mounts four routers and serves printable invoices. The module map highlights invoice.js. A numbered sequence follows a successful order from browser submission through JSON persistence and response.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#52647a"/>
    </marker>
    <style>
      text { font-family: system-ui, "Segoe UI", sans-serif; fill: #172a42; font-size: 13px; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12px; fill: #42566e; }
      .panel { fill: #fff; stroke: #ccd7e5; }
      .card { fill: #f1f6fc; stroke: #bdcde0; }
      .ticket { fill: #fff0d5; stroke: #b46d16; }
      .link { fill: none; stroke: #52647a; stroke-width: 1.5; marker-end: url(#arrow); }
      .track { stroke: #a7bad0; stroke-width: 2; }
      .number { fill: #234972; }
      .digit { fill: white; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#eaf0f7"/>
  <text class="title" x="32" y="47">ShopLedger architecture</text>
  <text x="33" y="70">Browser POS, inventory, Khata credit and printable GST invoices</text>

  <rect class="panel" x="28" y="92" width="650" height="646" rx="14"/>
  <rect class="panel" x="696" y="92" width="476" height="646" rx="14"/>
  <text class="heading" x="48" y="123">Module map</text>
  <text class="heading" x="716" y="123">Placing an order</text>

  <rect class="card" x="48" y="140" width="255" height="53" rx="7"/>
  <text class="label" x="60" y="160">public/ · Browser UI</text>
  <text class="small" x="60" y="180">index.html · css/style.css · js/app.js</text>
  <path class="link" d="M303 166 H346"/>
  <rect class="card" x="347" y="140" width="311" height="53" rx="7"/>
  <text class="label" x="360" y="160">server.js · Express</text>
  <text class="small" x="360" y="180">Static UI, JSON requests and invoice endpoint</text>
  <path class="link" d="M503 193 V216"/>
  <text class="small" x="515" y="210">mounts /api</text>

  <rect class="panel" x="48" y="217" width="610" height="123" rx="7"/>
  <text class="label" x="60" y="240">routes/</text>
  <text class="label" x="60" y="265">products.js</text>
  <text class="small" x="60" y="282">Catalog and coupons</text>
  <text class="label" x="352" y="265">orders.js</text>
  <text class="small" x="352" y="282">Create, list, view and cancel orders</text>
  <text class="label" x="60" y="310">customers.js</text>
  <text class="small" x="60" y="327">Khata accounts and settlements</text>
  <text class="label" x="352" y="310">reports.js</text>
  <text class="small" x="352" y="327">Dashboard, reconciliation, preview and export</text>
  <path class="link" d="M352 340 V369"/>
  <text class="small" x="364" y="359">calls modules in lib/</text>

  <rect class="panel" x="48" y="370" width="610" height="260" rx="7"/>
  <text class="label" x="60" y="392">lib/</text>
  <g>
    <rect class="card" x="60" y="402" width="286" height="40" rx="5"/>
    <text class="label" x="70" y="419">inventory.js</text>
    <text class="small" x="70" y="434">Sellable stock and stock updates</text>

    <rect class="card" x="359" y="402" width="287" height="40" rx="5"/>
    <text class="label" x="369" y="419">pricing.js</text>
    <text class="small" x="369" y="434">Checkout totals using coupons.js and tax.js</text>

    <rect class="card" x="60" y="447" width="286" height="40" rx="5"/>
    <text class="label" x="70" y="464">orders.js</text>
    <text class="small" x="70" y="479">Order records, dates and cancellation</text>

    <rect class="card" x="359" y="447" width="287" height="40" rx="5"/>
    <text class="label" x="369" y="464">ledger.js</text>
    <text class="small" x="369" y="479">Khata balances and settlements</text>

    <rect class="card" x="60" y="492" width="286" height="40" rx="5"/>
    <text class="label" x="70" y="509">coupons.js</text>
    <text class="small" x="70" y="524">Coupon validation and discounts</text>

    <rect class="card" x="359" y="492" width="287" height="40" rx="5"/>
    <text class="label" x="369" y="509">tax.js</text>
    <text class="small" x="369" y="524">HSN rates and CGST/SGST split</text>

    <rect class="card" x="60" y="537" width="286" height="40" rx="5"/>
    <text class="label" x="70" y="554">dates.js</text>
    <text class="small" x="70" y="569">Date formatting and normalization</text>

    <rect class="card" x="359" y="537" width="287" height="40" rx="5"/>
    <text class="label" x="369" y="554">reports.js</text>
    <text class="small" x="369" y="569">Dashboard and invoice reconciliation</text>

    <rect class="card" x="60" y="582" width="286" height="40" rx="5"/>
    <text class="label" x="70" y="599">store.js</text>
    <text class="small" x="70" y="614">JSON reads, writes and audit entries</text>

    <rect class="ticket" x="359" y="582" width="287" height="40" rx="5"/>
    <text class="label" x="369" y="599">invoice.js</text>
    <text class="small" x="369" y="614">Figures and HTML for GET /orders/:id/invoice</text>
  </g>

  <path class="link" d="M203 622 V658"/>
  <text class="small" x="215" y="651">reads / writes</text>
  <rect class="card" x="48" y="659" width="298" height="61" rx="7"/>
  <text class="label" x="60" y="680">data/db.json</text>
  <text class="small" x="60" y="697">Products, orders, customers, settlements,</text>
  <text class="small" x="60" y="712">audit log and ID counters</text>
  <rect class="card" x="359" y="659" width="299" height="61" rx="7"/>
  <text class="label" x="371" y="680">config.js</text>
  <text class="small" x="371" y="697">Shop settings, HSN rates, coupon rules,</text>
  <text class="small" x="371" y="712">inventory defaults, port and export key</text>

  <path class="track" d="M730 156 V647"/>
  <g>
    <circle class="number" cx="730" cy="156" r="13"/>
    <text class="digit" x="730" y="161">1</text>
    <text class="label" x="753" y="160">Submit the cart</text>
    <text x="753" y="180">public/js/app.js calls getSelectedCartItems() and post().</text>
    <text x="753" y="198">server.js dispatches POST /api/orders to routes/orders.js.</text>

    <circle class="number" cx="730" cy="229" r="13"/>
    <text class="digit" x="730" y="234">2</text>
    <text class="label" x="753" y="233">Load products and check stock</text>
    <text x="753" y="253">store.read() loads the JSON database.</text>
    <text x="753" y="271">inventory.find() resolves catalog items, then</text>
    <text x="753" y="289">inventory.check() verifies sellable stock.</text>

    <circle class="number" cx="730" cy="320" r="13"/>
    <text class="digit" x="730" y="325">3</text>
    <text class="label" x="753" y="324">Validate the coupon and calculate totals</text>
    <text x="753" y="344">pricing.subtotal() and coupons.validate() check eligibility.</text>
    <text x="753" y="362">pricing.computeTotals() allocates the discount, then</text>
    <text x="753" y="380">tax.getRateForItem() supplies each line’s GST rate.</text>

    <circle class="number" cx="730" cy="411" r="13"/>
    <text class="digit" x="730" y="416">4</text>
    <text class="label" x="753" y="415">Apply Khata credit when selected</text>
    <text x="753" y="435">ledger.chargeOrderToKhata() checks the credit limit</text>
    <text x="753" y="453">and adds the checkout total to the customer’s balance.</text>

    <circle class="number" cx="730" cy="484" r="13"/>
    <text class="digit" x="730" y="489">5</text>
    <text class="label" x="753" y="488">Deduct stock and record the order</text>
    <text x="753" y="508">inventory.reserve() deducts physical stock.</text>
    <text x="753" y="526">orders.add() assigns an ID and saves item snapshots,</text>
    <text x="753" y="544">customer, payment, status, coupon and checkout totals.</text>

    <circle class="number" cx="730" cy="575" r="13"/>
    <text class="digit" x="730" y="580">6</text>
    <text class="label" x="753" y="579">Persist the changes</text>
    <text x="753" y="599">store.appendAudit() records ORDER_CREATED.</text>
    <text x="753" y="617">store.write() rewrites data/db.json.</text>

    <circle class="number" cx="730" cy="648" r="13"/>
    <text class="digit" x="730" y="653">7</text>
    <text class="label" x="753" y="652">Return the saved order</text>
    <text x="753" y="672">The handler responds with HTTP 201 and the order.</text>
    <text x="753" y="690">The browser shows the saved total and an invoice link.</text>
  </g>

  <rect class="ticket" x="32" y="758" width="17" height="17" rx="3"/>
  <text x="58" y="771">Ticket module</text>
  <path class="link" d="M175 767 H209"/>
  <text x="221" y="771">Request, module call or data access</text>
  <circle class="number" cx="474" cy="767" r="10"/>
  <text class="digit" x="474" y="772">1</text>
  <text x="493" y="771">Order placement sequence</text>
</svg>